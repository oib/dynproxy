server {
    server_name ip.dynproxy.net;
    listen 80;
    listen [::]:80 default_server;

    location /lua_test {
        proxy_pass  http://127.0.0.1:8080;
        include     proxy_params;
    }

    location /update_ip {
        fastcgi_pass unix:/run/fcgiwrap.socket;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/ip/scripts/update_ip.sh;
    }

    location /update_zone {
        fastcgi_pass unix:/run/fcgiwrap.socket;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/ip/scripts/update_zone.sh;
    }

    location / {
        fastcgi_pass unix:/run/fcgiwrap.socket;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/ip/scripts/ip.sh;
    }

    #    location /lua_test {
    #        content_by_lua_block {
    #            ngx.say("Hello from Lua! Version: ", _VERSION);
    #        }
    #    }

    # Prevent access to token files
    location /token/ {
        deny all;
        return 403;
    }
}
